/* Cada deuda con su cronograma completo: qué cuota se pagó, cuál no y cuánto
   falta. Lo que la Agenda no muestra, porque la Agenda sólo mira hacia
   adelante. */

/* ------------------------------------------------- cargar deuda y fraccionar */

var MEDIOS = [["nps","NPS en banco"],["form1662","Formulario 1662"],
  ["detraccion","Cuenta de detracción (BN)"],["tarjeta","Tarjeta"],
  ["al_presentar","Al presentar la declaración"],
  ["transferencia","Transferencia"],["otro","Otro"]];
var TRIBUTOS = [["1011","1011 · IGV"],["3121","3121 · Renta MYPE"],
  ["3042","3042 · Retención 4ta"],["8021","8021 · Fraccionamiento"],
  ["otro","Otro"]];

/* El cronograma del RI viene como "1 30/11/2026 306.00 14.00 320.00 1,243.00":
   número, vencimiento, amortización, interés, total y saldo. Se pega tal cual
   y se muestra lo entendido para revisarlo antes de guardar. */
function leerCronograma(texto){
  var out = [];
  String(texto || "").split(/\n+/).forEach(function(linea){
    var f = linea.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
    if(!f) return;
    var resto = linea.replace(f[0], " ");
    var nums = (resto.match(/-?[\d.,]*\d/g) || []).map(function(x){
      return Number(String(x).replace(/,/g,""));
    }).filter(function(x){ return !isNaN(x); });
    if(!nums.length) return;
    var numero = Math.round(nums[0]);
    var monto;
    if(nums.length >= 5) monto = nums[3];        // n, amort, interes, total, saldo
    else if(nums.length === 4) monto = nums[3];  // n, amort, interes, total
    else monto = nums[nums.length - 1];
    out.push({numero:numero,
      vence: f[3] + "-" + ("0"+f[2]).slice(-2) + "-" + ("0"+f[1]).slice(-2),
      monto: r2(monto)});
  });
  return out;
}

      return {

  var resueltas = grupos.filter(function(g){

  var saldoTot = r2(grupos.reduce(function(s,g){ return s + g.saldo; },0));
  var vencTot = r2(grupos.reduce(function(s,g){
    return s + g.cs.filter(function(c){ return !c.pagada_en && dias(c.vence) < 0; })
      .reduce(function(a,c){ return a + Number(c.monto); },0);
  },0));

  function confirmar(c){
    p.marcarCuota(c, fpago).then(function(){ setMarcando(null); });
  }

  var enAmbito = function(g){
    var x = grupoG(g);
    if(amb === "externa") return x === "externa" || x === "sin_definir";
    return ambitoOk(amb, x);
  };
  var res = resueltas.filter(enAmbito);
  var emisoresAmb = p.emisores.filter(function(e){
    if(!e.activo) return false;
    var x = p.esMio(e.ruc) ? "mio"
      : grupoDe4(p.esMio, e.persona_id ? p.P[e.persona_id] : null);
    if(amb === "externa") return x === "externa" || x === "sin_definir";
    return ambitoOk(amb, x);
  });

  return h("div",null,
    CHIPS,
    h("div",{className:"row",style:{gap:14,marginBottom:14}},
      h("button",{className:"lk",onClick:function(){ setNueva(!nueva); }},
        nueva ? "cerrar" : "agregar una deuda"),
      res.length ? h("button",{className:"lk",
        onClick:function(){ setVerRes(!verRes); }},
        verRes ? "ocultar las resueltas"
               : "ver " + plural(res.length,"deuda resuelta","deudas resueltas")) : null),
    nueva ? h(NuevaDeuda,{emisores:emisoresAmb,crear:p.crear,
      cerrar:function(){ setNueva(false); }}) : null,
    !grupos.length ? h("div",{className:"card",style:{padding:"30px 16px",
      textAlign:"center",color:"var(--ink70)",fontSize:14}},
      "No hay deudas en este ámbito.") : null,
    h("div",{className:"grid",style:{gridTemplateColumns:
        "repeat(auto-fit,minmax(170px,1fr))",marginBottom:22}},
      h(Kpi,{l:"Saldo total",v:miles(saldoTot),
        sub:plural(grupos.length,"deuda","deudas")+" en curso"}),
      h(Kpi,{l:"Vencido sin pagar",v:miles(vencTot),
        c: vencTot>0 ? "var(--alerta)" : "var(--verde)",
        sub: vencTot>0 ? "paga esto primero" : "nada atrasado"}),
      h(Kpi,{l:"Ya pagado",v:miles(grupos.reduce(function(s,g){ return s+g.pagado; },0)),
        c:"var(--verde)",sub:"de todos los cronogramas"})),

    grupos.map(function(g){
      var esFrac = g.o.tipo === "fraccionamiento";
      return h("div",{key:g.o.id,className:"card",
          style:{marginBottom:20,
            borderColor: g.vencidas ? "var(--alerta)" : "var(--rule)",
            borderLeftWidth: g.vencidas ? 3 : 1}},

        h("div",{style:{padding:"14px 16px",borderBottom:"1px solid var(--rule)"}},
          h("div",{style:{display:"flex",justifyContent:"space-between",
              gap:12,flexWrap:"wrap",alignItems:"baseline"}},
            h("div",null,
              h("div",{style:{fontSize:15,fontWeight:600}},
                esFrac ? "Fraccionamiento" : "IGV " + (g.o.referencia||""),
                esFrac && g.o.referencia
                  ? h("span",{className:"mono",style:{fontSize:11,fontWeight:400,
                      color:"var(--ink40)"}}, " · " + g.o.referencia) : null),
              h("div",{className:"hint",style:{marginTop:3}},
                g.e.nombre, g.e.ruc ? h("span",{className:"mono"}," · "+g.e.ruc) : null,
                h("span",{className:"mono"},
                  " · tributo " + (esFrac ? "8021" : "1011")))),
            h("div",{style:{textAlign:"right"}},
              h("div",{className:"mono",style:{fontSize:18}}, money(g.saldo)),
              h("div",{className:"hint",style:{marginTop:2}},
                esFrac ? g.pagadas + " de " + (g.o.cuotas || g.cs.length) + " cuotas pagadas"
                       : (g.pagadas ? "pagado" : "pendiente")))),

          esFrac ? h("div",{style:{marginTop:10}},
            h("div",{style:{height:4,background:"var(--rule)",overflow:"hidden"}},
              h("div",{style:{height:"100%",width:
                  Math.round(g.pagadas/Math.max(g.o.cuotas||g.cs.length,1)*100)+"%",
                background: g.vencidas ? "var(--alerta)" : "var(--verde)"}}))) : null,

          h("div",{className:"row",style:{marginTop:10,gap:12}},
            h("button",{className:"lk",onClick:function(){
              setAccion(accion && accion.id===g.o.id && accion.tipo==="pago"
                ? null : {id:g.o.id, tipo:"pago"}); }},
              "registrar un pago"),
            !esFrac ? h("button",{className:"lk",onClick:function(){
              setAccion(accion && accion.id===g.o.id && accion.tipo==="frac"
                ? null : {id:g.o.id, tipo:"frac"}); }},
              "fraccionar el saldo") : null),

          (function(){
            var ps = pagosDe(g.o.id);
            if(!ps.length) return null;
            var pag = r2(ps.filter(function(x){ return x.estado==="pagado"; })
              .reduce(function(s,x){ return s+Number(x.monto); },0));
            return h("div",{className:"hint",style:{marginTop:8,lineHeight:1.7}},
              ps.map(function(x,i){
                var med = MEDIOS.filter(function(m){ return m[0]===x.medio; })[0];
                return h("div",{key:i,style:{color: x.estado==="pagado"
                    ? "var(--verde)" : "var(--ambar)"}},
                  (x.estado==="pagado" ? "Pagado " : "NPS por ") + money(x.monto) +
                  (med ? " · " + med[1] : "") +
                  (x.fecha_pago ? " · " + fechaCorta(x.fecha_pago) : "") +
                  (x.referencia ? " · " + x.referencia : ""));
              }),
              pag > 0 && pag < g.saldo
                ? h("div",{style:{marginTop:3}},
                    "Queda " + money(r2(g.saldo - pag)) + " por cubrir.")
                : null);
          })(),

          g.vencidas ? h("div",{className:"hint",style:{marginTop:10,
              color:"var(--alerta)",lineHeight:1.7}},
            !esFrac
              ? "Vencido. Sigue corriendo interés moratorio hasta que se pague. Si no alcanza de una, se puede fraccionar antes de que SUNAT lo pase a cobranza."
              : (g.vencidas === 1
                  ? "1 cuota vencida. Con dos consecutivas impagas se pierde el fraccionamiento (Art. 36) y la deuda vuelve entera, con intereses."
                  : g.vencidas + " cuotas vencidas. Dos consecutivas ya configuran la pérdida: conviene verificar hoy en SUNAT si el fraccionamiento sigue vigente.")) : null),

        accion && accion.id === g.o.id && accion.tipo === "pago"
          ? h(RegistrarPago,{g:g,pagar:p.pagar,
              sugerido: g.prox ? g.prox.monto : g.saldo,
              cuota: esFrac && g.prox ? g.prox.numero : null,
              cerrar:function(){ setAccion(null); }}) : null,
        accion && accion.id === g.o.id && accion.tipo === "frac"
          ? h(Fraccionar,{g:g,fraccionar:p.fraccionar,
              saldo: r2(g.saldo - r2(pagosDe(g.o.id)
                .filter(function(x){ return x.estado==="pagado"; })
                .reduce(function(s,x){ return s+Number(x.monto); },0))),
              cerrar:function(){ setAccion(null); }}) : null,

        h("div",{style:{overflowX:"auto"}},
          h("table",null,
            h("thead",null,h("tr",null,
              ["Cuota","Vence","Monto","Estado",""].map(function(t,i){
                return h("th",{key:i,style:{textAlign: i===2?"right":(i===4?"right":"left"),
                  padding:"8px 14px",borderBottom:"1px solid var(--rule)",
                  font:"9px/1 var(--mono)",textTransform:"uppercase",
                  letterSpacing:".12em",color:"var(--ink40)",whiteSpace:"nowrap"}}, t); }))),
            h("tbody",null, g.cs.map(function(c){
              var d = dias(c.vence);
              var estado = c.pagada_en ? "pagada" : (d < 0 ? "vencida" : "pendiente");
              var color = c.pagada_en ? "var(--verde)"
                        : (d < 0 ? "var(--alerta)" : "var(--ink40)");
              var k = c.obligacion_id + "|" + c.numero;
              return h("tr",{key:k,style:{opacity: c.pagada_en ? .6 : 1}},
                h("td",{className:"mono",style:{padding:"9px 14px",
                  borderTop:"1px solid var(--rule)",fontSize:12}},
                  esFrac ? (c.numero + " / " + (g.o.cuotas || g.cs.length)) : "única"),
                h("td",{className:"mono",style:{padding:"9px 14px",
                  borderTop:"1px solid var(--rule)",fontSize:12,whiteSpace:"nowrap"}},
                  fechaCorta(c.vence),
                  !c.pagada_en ? h("span",{style:{color:color}},
                    " · " + cuandoTxt(c.vence)) : null),
                h("td",{className:"mono",style:{padding:"9px 14px",textAlign:"right",
                  borderTop:"1px solid var(--rule)",fontSize:13}}, money(c.monto)),
                h("td",{style:{padding:"9px 14px",borderTop:"1px solid var(--rule)"}},
                  h("span",{className:"mono",style:{fontSize:11,color:color}},
                    estado + (c.pagada_en ? " el " + fechaCorta(c.pagada_en) : ""))),
                h("td",{style:{padding:"9px 14px",textAlign:"right",
                    borderTop:"1px solid var(--rule)",whiteSpace:"nowrap"}},
                  c.pagada_en
                    ? h("button",{className:"lk",
                        onClick:function(){ p.marcarCuota(c, null); }},"deshacer")
                    : (marcando === k
                        ? h("span",{className:"row",style:{gap:6,justifyContent:"flex-end"}},
                            h("input",{className:"in mono",type:"date",value:fpago,
                              style:{width:134,fontSize:12,padding:"4px 6px"},
                              onChange:function(e){ setFpago(e.target.value); }}),
                            h("button",{className:"btn ok sm",
                              onClick:function(){ confirmar(c); }},"ok"),
                            h("button",{className:"lk",
                              onClick:function(){ setMarcando(null); }},"x"))
                        : h("button",{className:"btn sec sm",
                            onClick:function(){ setFpago(hoyISO()); setMarcando(k); }},
                            "pagada"))));
            })))));
    }),

    verRes && res.length ? h("div",{style:{marginTop:8}},
      h(Caps,null,"Resueltas"),
      res.map(function(g){
        var ps = pagosDe(g.o.id);
        return h("div",{key:g.o.id,className:"card",
            style:{padding:"11px 14px",marginBottom:8,opacity:.75}},
          h("div",{style:{display:"flex",justifyContent:"space-between",
              gap:10,flexWrap:"wrap"}},
            h("div",null,
              h("div",{style:{fontSize:13}},
                (g.o.tipo === "fraccionamiento" ? "Fraccionamiento " : "") +
                (g.o.referencia || "")),
              h("div",{className:"hint",style:{marginTop:2}},
                g.e.nombre + " · " +
                (g.o.estado === "fraccionada" ? "se fraccionó" : "pagada") +
                (g.o.resuelta_en ? " el " + fechaCorta(g.o.resuelta_en) : ""))),
            h("div",{className:"mono",style:{fontSize:13,color:"var(--ink40)"}},
              money(g.o.monto_total))),
          ps.length ? h("div",{className:"hint",style:{marginTop:5}},
            ps.map(function(x,i){
              var med = MEDIOS.filter(function(m){ return m[0]===x.medio; })[0];
              return h("div",{key:i},
                "Pagado " + money(x.monto) + (med ? " · " + med[1] : ""));
            })) : null,
          g.o.notas ? h("div",{className:"hint",style:{marginTop:5}}, g.o.notas) : null);
      })) : null,

    h("div",{className:"hint",style:{marginTop:8,lineHeight:1.8}},
      "El fraccionamiento se paga con NPS o Formulario 1662, código de tributo 8021, citando el número de RI. ",
      h("br",null),
      "El IGV prorrogado va con código 1011 del periodo que corresponde, no del mes en que se paga."));
}

function Raiz(){
  var s1 = useState(undefined), sesion = s1[0], setSesion = s1[1];
  useEffect(function(){
    db.auth.getSession().then(function(r){ setSesion(r.data.session || null); });
    var sub = db.auth.onAuthStateChange(function(_e, s){ setSesion(s || null); });
    return function(){ if(sub && sub.data) sub.data.subscription.unsubscribe(); };
  },[]);
  if(sesion === undefined) return h("div",{className:"mono",
    style:{padding:"80px 16px",textAlign:"center",color:"var(--ink40)",
      fontSize:12}}, "…");
  if(!sesion) return h(Acceso,null);
  return h(App,{sesion:sesion, key:sesion.user.id});
}

ReactDOM.createRoot(document.getElementById("raiz")).render(h(Raiz,null));
</script>
</body>
</html>
